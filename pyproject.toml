[project]
name = "mcp-devops-server"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.4,<2.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
mcp-devops-server = "mcp_devops_server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
